name: Generation to Home Workflow

on: [push]

jobs:
  make-sld:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install
        run: pip install matplotlib

      - name: Generate Image
        run: python generate_workflow.py

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Generation-To-Home-SLD
          path: generation_to_home_workflow.png
